services:
  format-broker1:
    profiles: 
      - format
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-storage.sh
      - format
      - --ignore-formatted
      - -t 
      - MCL8kv1SWm87L_Md-I2hg
      - -c  
      - /config/broker1.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker1:/data
  format-broker2:
    profiles: 
      - format
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-storage.sh
      - format
      - --ignore-formatted
      - -t 
      - MCL8kv1SWm87L_Md-I2hg
      - -c  
      - /config/broker2.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker2:/data 
  format-broker3:
    profiles: 
      - format
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-storage.sh
      - format
      - --ignore-formatted
      - -t 
      - MCL8kv1SWm87L_Md-I2hg
      - -c  
      - /config/broker3.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker3:/data 

  format-quorum1:
    profiles: 
      - format
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-storage.sh
      - format
      - --ignore-formatted
      - -t 
      - MCL8kv1SWm87L_Md-I2hg
      - -c  
      - /config/quorum1.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/quorum1:/data    
### cluster
  broker1:
    profiles: 
      - cluster
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-server-start.sh 
      - /config/broker1.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker1:/data
    depends_on:
      - quorum1
  broker2:
    profiles: 
      - cluster
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-server-start.sh 
      - /config/broker2.properties
    depends_on:
      - quorum1

    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker2:/data
  broker3:
    profiles: 
      - cluster
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-server-start.sh 
      - /config/broker3.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker3:/data
    depends_on:
      - quorum1
  quorum1:
    profiles:
      - cluster
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-server-start.sh 
      - /config/quorum1.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/quorum1:/data
### client
  client:
    profiles: 
      - client
    build:
      context: ./java
    command: 
      - bash 
      - -c 
      - "sleep 3600"


  ### node demo services
  node-producer:
    profiles:
      - producer-node
    build:
      context: ./node
    working_dir: /app
    volumes:
      - ./src/node:/app
    environment:
      BROKERS: broker1:9092,broker2:9092,broker3:9092
      TOPIC: demo-node
      CLIENT_ID: node-producer
      INTERVAL_MS: 1000
    command:
      - bash
      - -c
      - "npm install && npm run start:producer"

  node-consumer:
    profiles:
      - consumer-node
    build:
      context: ./node
    working_dir: /app
    volumes:
      - ./src/node:/app
    environment:
      BROKERS: broker1:9092,broker2:9092,broker3:9092
      TOPIC: demo-node
      CLIENT_ID: node-consumer
      GROUP_ID: demo-node-group
      FROM_BEGINNING: "false"
    command:
      - bash
      - -c
      - "npm install && npm run start:consumer"

  ### python demo services
  py-producer:
    profiles:
      - producer-python
    build:
      context: ./python
    working_dir: /app
    volumes:
      - ./src/python:/app
    environment:
      BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092
      TOPIC: demo-python
      CLIENT_ID: py-producer
      INTERVAL_MS: 1000
    command:
      - bash
      - -c
      - "pip install -r requirements.txt && python producer.py"

  py-consumer:
    profiles:
      - consumer-python
    build:
      context: ./python
    working_dir: /app
    volumes:
      - ./src/python:/app
    environment:
      BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092
      TOPIC: demo-python
      GROUP_ID: demo-python-group
      CLIENT_ID: py-consumer
      AUTO_OFFSET_RESET: earliest
    command:
      - bash
      - -c
      - "pip install -r requirements.txt && python consumer.py"