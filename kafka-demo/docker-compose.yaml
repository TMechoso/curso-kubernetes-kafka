services:
  format-broker1:
    profiles: 
      - format
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-storage.sh
      - format
      - --ignore-formatted
      - -t 
      - MCL8kv1SWm87L_Md-I2hg
      - -c  
      - /config/broker1.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker1:/data
  format-broker2:
    profiles: 
      - format
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-storage.sh
      - format
      - --ignore-formatted
      - -t 
      - MCL8kv1SWm87L_Md-I2hg
      - -c  
      - /config/broker2.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker2:/data 
  format-broker3:
    profiles: 
      - format
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-storage.sh
      - format
      - --ignore-formatted
      - -t 
      - MCL8kv1SWm87L_Md-I2hg
      - -c  
      - /config/broker3.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker3:/data 

  format-quorum1:
    profiles: 
      - format
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-storage.sh
      - format
