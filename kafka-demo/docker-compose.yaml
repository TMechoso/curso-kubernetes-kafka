      - ./config:/config
      - ./data/quorum1:/data    
### cluster
  broker1:
    profiles: 
      - cluster
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-server-start.sh 
      - /config/broker1.properties
    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker1:/data
    depends_on:
      - quorum1
  broker2:
    profiles: 
      - cluster
    build:
      context: ./java
    command: 
      - /opt/kafka/bin/kafka-server-start.sh 
      - /config/broker2.properties
    depends_on:
      - quorum1

    volumes:
      - ./files:/files
      - ./config:/config
      - ./data/broker2:/data
  broker3:
    profiles: 
